# Explicit local-only container demo. Production configuration rejects TEST_USER.
services:
  app:
    environment:
      NODE_ENV: development
      DEPLOYMENT_PROFILE: local
      AUTH_MODE: TEST_USER
      APP_ORIGIN: http://localhost:3000
      SERVE_FRONTEND: "true"
  migrate:
    environment:
      NODE_ENV: development
      DEPLOYMENT_PROFILE: local
      AUTH_MODE: TEST_USER
      APP_ORIGIN: http://localhost:3000
