x-app-environment: &app-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 3000
  APP_NAME: ${APP_NAME:-Template App}
  APP_ORIGIN: ${APP_ORIGIN:-https://template.example.com}
  DATABASE_URL: ${DATABASE_URL:-postgresql://template:local-development-only@postgres:5432/template}
  AUTH_MODE: ENTRA
  ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
  ENTRA_API_CLIENT_ID: ${ENTRA_API_CLIENT_ID:-}
  ENTRA_SPA_CLIENT_ID: ${ENTRA_SPA_CLIENT_ID:-}
  ENTRA_SCOPE: ${ENTRA_SCOPE:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TRUST_PROXY: ${TRUST_PROXY:-false}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-template}
      POSTGRES_USER: ${POSTGRES_USER:-template}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: migrator
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  app:
    build:
      context: .
      target: runtime
    environment: *app-environment
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
