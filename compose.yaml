x-app-environment: &app-environment
  NODE_ENV: production
  DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-production}
  HOST: 0.0.0.0
  PORT: 3000
  APP_NAME: ${APP_NAME:-Planning}
  APP_ORIGIN: ${APP_ORIGIN:-https://planning.example.com}
  DATABASE_URL: ${DATABASE_URL:-postgresql://template:local-development-only@postgres:5432/template}
  AUTH_MODE: ENTRA
  ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
  ENTRA_API_CLIENT_ID: ${ENTRA_API_CLIENT_ID:-}
  ENTRA_SPA_CLIENT_ID: ${ENTRA_SPA_CLIENT_ID:-}
  ENTRA_SCOPE: ${ENTRA_SCOPE:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Europe/London}
  INGESTION_MAX_BODY_BYTES: ${INGESTION_MAX_BODY_BYTES:-10485760}
  UPLOAD_MAX_FILE_BYTES: ${UPLOAD_MAX_FILE_BYTES:-5242880}
  ZIP_MAX_ENTRIES: ${ZIP_MAX_ENTRIES:-1000}
  JSON_MAX_DEPTH: ${JSON_MAX_DEPTH:-100}
  GEOJSON_MAX_POSITIONS: ${GEOJSON_MAX_POSITIONS:-100000}
  EXPORT_MAX_SELECTION: ${EXPORT_MAX_SELECTION:-500}
  EXPORT_MAX_BYTES: ${EXPORT_MAX_BYTES:-104857600}
  EXPORT_GENERATION_TIMEOUT_MS: ${EXPORT_GENERATION_TIMEOUT_MS:-30000}
  EXPORT_DOWNLOAD_TIMEOUT_MS: ${EXPORT_DOWNLOAD_TIMEOUT_MS:-120000}
  IDEMPOTENCY_RETENTION_DAYS: ${IDEMPOTENCY_RETENTION_DAYS:-30}
  API_KEY_DEFAULT_EXPIRY_DAYS: ${API_KEY_DEFAULT_EXPIRY_DAYS:-90}
  API_KEY_MAX_EXPIRY_DAYS: ${API_KEY_MAX_EXPIRY_DAYS:-365}
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
  RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
  RATE_LIMIT_USER_MAX: ${RATE_LIMIT_USER_MAX:-120}
  RATE_LIMIT_WRITE_MAX: ${RATE_LIMIT_WRITE_MAX:-30}
  RATE_LIMIT_KEY_MAX: ${RATE_LIMIT_KEY_MAX:-30}
  RATE_LIMIT_INTEGRATION_IP_MAX: ${RATE_LIMIT_INTEGRATION_IP_MAX:-120}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-template}
      POSTGRES_USER: ${POSTGRES_USER:-template}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: migrator
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  app:
    build:
      context: .
      target: runtime
    environment: *app-environment
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
